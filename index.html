<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>AGUA/24</title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#42B9D4" />
    <meta
      name="description"
      content="AGUA/24: recarga saldo y dispensa agua purificada desde tu celular."
    />

    <!-- Icono principal -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Manifest PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS: que se comporte como app instalada -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AGUA/24" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Stripe -->
    <link rel="preconnect" href="https://js.stripe.com" />
    <link rel="dns-prefetch" href="https://js.stripe.com" />

  </head>

  <body>
    <noscript>Necesitas habilitar JavaScript para usar esta app.</noscript>
    <div class="dhiwise-code" id="root">
      <main id="startup-fallback" role="status" aria-live="polite"
        style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f0f9ff;color:#1e3f7a;font-family:Arial,sans-serif;text-align:center;box-sizing:border-box">
        <div style="max-width:340px">
          <p style="font-size:30px;font-weight:800">AGUA<span style="color:#42b9d4">/24</span></p>
          <h1 id="startup-title" style="font-size:20px">Cargando la aplicación…</h1>
          <p id="startup-detail" style="font-size:14px;line-height:1.6;color:#475569">Estamos preparando tu acceso.</p>
          <button id="startup-retry" type="button" hidden
            style="border:0;border-radius:12px;background:#1e3f7a;color:white;padding:12px 20px;font-size:16px;cursor:pointer">Reintentar</button>
        </div>
      </main>
    </div>

    <script>
      (function () {
        function showStartupProblem() {
          if (!document.getElementById('startup-fallback')) return;
          document.getElementById('startup-title').textContent = 'No se pudo terminar de cargar';
          document.getElementById('startup-detail').textContent = 'Comprueba tu conexión a internet e intenta nuevamente.';
          document.getElementById('startup-retry').hidden = false;
        }
        document.getElementById('startup-retry').addEventListener('click', function () { window.location.reload(); });
        window.addEventListener('error', showStartupProblem, true);
        window.addEventListener('unhandledrejection', showStartupProblem);
        window.setTimeout(showStartupProblem, 15000);
      })();
    </script>

    <!-- Tu bundle de React -->
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
